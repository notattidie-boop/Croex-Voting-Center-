    <script>
      // Gracefully prevent unhandled WebSocket closure notices in preview sandboxes
      (function() {
        try {
          const _NativeWebSocket = window.WebSocket;
          if (_NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              const target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.url = url;
              target.protocol = '';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
              };
              setTimeout(() => {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch {}
              }, 20);
              return target;
            };
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch {}

        function isIgnorableNotice(val) {
          const str = String(val || '').toLowerCase();
          return (
            str.includes('websocket') ||
            str.includes('[vite]') ||
            str.includes('connection lost') ||
            str.includes('could not reach cloud firestore backend') ||
            str.includes('connection failed') ||
            str.includes("backend didn't respond within 10 seconds") ||
            str.includes('[code=unavailable]') ||
            str.includes('the client will operate in offline mode')
          );
        }

        const _origConsoleError = console.error;
        console.error = function(...args) {
          const str = args.map(a => (a && a.message) || String(a)).join(' ');
          if (isIgnorableNotice(str)) {
            return;
          }
          _origConsoleError.apply(console, args);
        };

        const _origConsoleWarn = console.warn;
        console.warn = function(...args) {
          const str = args.map(a => (a && a.message) || String(a)).join(' ');
          if (isIgnorableNotice(str)) {
            return;
          }
          _origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (isIgnorableNotice(msg)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = (event && (event.reason && (event.reason.message || String(event.reason)))) || '';
          if (isIgnorableNotice(reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
