<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <radialGradient id="croexBoxBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="60%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="96" />
    </clipPath>
  </defs>

  <!-- Squircle / Rounded Box Container (No Circle) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#croexBoxBg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="url(#goldBorderGrad)" stroke-width="6" />

  <!-- Embedded High-Definition Official Croex Badge -->
  <image href="/croex-logo-hd.png" x="16" y="16" width="480" height="480" preserveAspectRatio="xMidYMid meet" clip-path="url(#squircleClip)" />
</svg>
